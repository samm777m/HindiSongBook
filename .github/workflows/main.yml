name: Build HindiSongBook APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.6.0"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platforms;android-37|build-tools" || true

      - name: Check Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiSongBook-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
