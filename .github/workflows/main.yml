name: Build HindiSongBook APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Show project structure
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository structure:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.6.0"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle was not found."
            echo ""
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Found Gradle project:"
          echo "$PROJECT_DIR"

          echo "GRADLE_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          cd "$GRADLE_PROJECT_DIR"

          echo "Gradle project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking required files..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

          echo "Gradle project structure OK."

      - name: Check Gradle version
        shell: bash
        run: |
          cd "$GRADLE_PROJECT_DIR"
          gradle --version

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platforms;android-37|build-tools" || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$GRADLE_PROJECT_DIR"

          echo "Building from:"
          pwd

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GRADLE_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiSongBook-debug
          path: ${{ env.GRADLE_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
